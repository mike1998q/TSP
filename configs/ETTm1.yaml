# ETTm1 — Electricity Transformer Temperature, 15-min (7 channels, 69,680 rows)
# 4x more data than ETTh -> fewer epochs needed, lighter regularization.
# Standard ETT split: 0.6 / 0.2 / 0.2. Horizons: pred_len in {96,192,336,720}.

experiment:
  name: ETTm1
  seed: 2024
  checkpoint_dir: checkpoints

data:
  source: csv
  csv_path: data/ETTm1.csv
  target_columns: null
  seq_len: 336
  pred_len: 96
  train_ratio: 0.6
  val_ratio: 0.2
  scale: true

model:
  d_model: 128
  time_kernel_size: 25
  time_dropout: 0.1
  time_encoder: mamba
  mamba_layers: 2
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  use_official_mamba: true
  freq_hidden: 128
  freq_dropout: 0.1
  freq_sparsity: 0.0
  freq_encoder: linear
  fusion: gated
  head_dropout: 0.1

train:
  device: auto
  epochs: 10
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.0001
  loss: mse
  grad_clip: 5.0
  num_workers: 4
  patience: 6
  min_delta: 0.0
  amp: true
  lr_scheduler: cosine
  compile: false

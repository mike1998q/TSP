# PEMS04 — traffic flow, 5-min sampling (307 sensor channels).
# Confirmatory dataset (review request): NOT used to tune DD-Mamba's design.
# Protocol: 0.6/0.2/0.2 chronological split (iTransformer/S-Mamba), seq_len 96,
# horizons {96,192,336,720}. Provide the standard PEMS04.npz (key 'data',
# shape (T, N, F); feature 0 = flow) at the csv_path below.

experiment:
  name: pems04
  seed: 2024
  checkpoint_dir: checkpoints

data:
  source: npz
  csv_path: data/PEMS04.npz
  npz_key: data
  npz_feature: 0            # 0 = traffic flow
  target_columns: null
  seq_len: 96
  pred_len: 96
  train_ratio: 0.6
  val_ratio: 0.2
  scale: true

model:
  d_model: 256               # Parameter-reduced (was 512): the variate mixer
                             # dominates params and scales with d_model^2, so
                             # 512->256 cuts the model ~4x. With mixer_placement
                             # =shared this is ~2.9M (vs ~19.7M at d512+both).
                             # A smaller width also lowers the activation
                             # magnitudes that risk fp16 AMP overflow here.
  time_kernel_size: 25
  time_dropout: 0.1
  time_encoder: mlp          # S-Mamba recipe: MLP over time, Mamba over variates
  mamba_layers: 2
  mamba_d_state: 32
  mamba_d_conv: 4
  mamba_expand: 2
  use_official_mamba: true
  freq_hidden: 256           # match d_model (reduced from 512)
  freq_dropout: 0.1
  freq_sparsity: 0.0
  freq_encoder: linear
  channel_mixer_layers: 2
  mixer_placement: shared    # weight-tie one mixer across branches: ~5.3M -> ~2.9M
  fusion: gated
  head_dropout: 0.1
  # Baseline sweeps read these (scripts/run_unified_baselines.py):
  baseline_d_model: 256
  baseline_layers: 2

train:
  device: auto
  epochs: 10
  batch_size: 16
  lr: 0.0002                 # lowered from 5e-4 for large-channel stability
                             # (matches PEMS07/08, which diverged to NaN at 5e-4).
  weight_decay: 0.0001
  loss: mse
  grad_clip: 5.0
  num_workers: 4
  patience: 5
  amp: false                 # DISABLED: fp16 AMP can overflow the variate mixer
                             # on large-channel data; the Mamba scan is fp32 anyway.
  lr_scheduler: halve
  compile: false

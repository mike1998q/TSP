# PEMS07 — traffic flow, 5-min sampling (883 sensor channels).
# Confirmatory dataset (review request): NOT used to tune DD-Mamba's design.
# Protocol: 0.6/0.2/0.2 chronological split (iTransformer/S-Mamba), seq_len 96,
# horizons {96,192,336,720}. Provide the standard PEMS07.npz (key 'data',
# shape (T, N, F); feature 0 = flow) at the csv_path below.

experiment:
  name: pems07
  seed: 2024
  checkpoint_dir: checkpoints

data:
  source: npz
  csv_path: data/PEMS07.npz
  npz_key: data
  npz_feature: 0            # 0 = traffic flow
  target_columns: null
  seq_len: 96
  pred_len: 96
  train_ratio: 0.6
  val_ratio: 0.2
  scale: true

model:
  d_model: 512
  time_kernel_size: 25
  time_dropout: 0.1
  time_encoder: mlp          # S-Mamba recipe: MLP over time, Mamba over variates
  mamba_layers: 2
  mamba_d_state: 32
  mamba_d_conv: 4
  mamba_expand: 2
  use_official_mamba: true
  freq_hidden: 512
  freq_dropout: 0.1
  freq_sparsity: 0.0
  freq_encoder: linear
  channel_mixer_layers: 2
  fusion: gated
  head_dropout: 0.1
  # Baseline sweeps read these (scripts/run_unified_baselines.py):
  baseline_d_model: 512
  baseline_layers: 2

train:
  device: auto
  epochs: 10
  batch_size: 16
  lr: 0.0005
  weight_decay: 0.0001
  loss: mse
  grad_clip: 5.0
  num_workers: 4
  patience: 5
  amp: true
  lr_scheduler: halve
  compile: false

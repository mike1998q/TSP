# Electricity (ECL) — household consumption, hourly (321 channels, 26,304 rows)
# Standard split: 0.7 / 0.1 / 0.2. Horizons: pred_len in {96, 192, 336, 720}.
# Many channels: channel-independent processing folds C into the batch
# (16 x 321 = 5,136 sequences per step) -- sized for a 32 GB RTX 5090.

experiment:
  name: electricity
  seed: 2024
  checkpoint_dir: checkpoints

data:
  source: csv
  csv_path: data/electricity.csv
  target_columns: null
  seq_len: 96
  pred_len: 96
  train_ratio: 0.7
  val_ratio: 0.1
  scale: true

model:
  d_model: 512               # REVERTED from 256. The d256 cut (2.83M) was
                             # measured to cost +0.0045 avg MSE on this dataset
                             # (0.1678 -> 0.1722), which flips DD-Mamba from
                             # beating to losing against published S-Mamba
                             # (0.170). Electricity has 321 channels and the
                             # highest cross-channel coupling in the suite, so
                             # the variate mixer -- whose width scales as
                             # d_model^2 -- is doing real work here. Paired with
                             # mixer_placement=shared below this is ~10.6M
                             # (d512+both is ~19.7M).
  time_kernel_size: 25
  time_dropout: 0.1
  time_encoder: mlp          # S-Mamba recipe: linear/MLP over time,
                             # Mamba over variates (memory-scalable)
  mamba_layers: 2
  mamba_d_state: 32          # richer state for many variates
  mamba_d_conv: 4
  mamba_expand: 2
  use_official_mamba: true
  freq_hidden: 512           # match d_model (reverted with it)
  freq_dropout: 0.1
  freq_sparsity: 0.0
  freq_encoder: linear
  channel_mixer_layers: 2  # the core of the model on high-channel data
  mixer_placement: shared  # weight-tie one mixer across branches: halves the
                           # mixer parameters (~19.7M -> ~10.6M at d512). Unlike
                           # the width cut above, tying was measured
                           # accuracy-neutral here (dMSE -0.0001, CI includes 0;
                           # results/Ablation_electricity_mixer.json), so it is
                           # kept. Sharing the mixer and shrinking it are NOT
                           # equivalent: only the latter removes capacity.
  fusion: gated
  head_dropout: 0.1

train:
  device: auto
  epochs: 10
  batch_size: 16
  lr: 0.0005
  weight_decay: 0.0001
  loss: mse
  grad_clip: 5.0
  num_workers: 4
  patience: 5
  amp: true
  lr_scheduler: halve      # lr *= 0.5 each epoch; converges before patience can misfire
  compile: false

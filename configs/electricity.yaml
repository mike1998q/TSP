# Electricity (ECL) — household consumption, hourly (321 channels, 26,304 rows)
# Standard split: 0.7 / 0.1 / 0.2. Horizons: pred_len in {96, 192, 336, 720}.
# Many channels: channel-independent processing folds C into the batch
# (16 x 321 = 5,136 sequences per step) -- sized for a 32 GB RTX 5090.

experiment:
  name: electricity
  seed: 2024
  checkpoint_dir: checkpoints

data:
  source: csv
  csv_path: data/electricity.csv
  target_columns: null
  seq_len: 96
  pred_len: 96
  train_ratio: 0.7
  val_ratio: 0.1
  scale: true

model:
  d_model: 512               # High-channel capacity setting. Paired with
                             # mixer_placement=shared below, the model is ~10.6M
                             # parameters -- about half of the d512+both variant
                             # (~19.7M). Accuracy comparisons for this budget are
                             # reported in the manuscript, not selected here.
  time_kernel_size: 25
  time_dropout: 0.1
  time_encoder: mlp          # S-Mamba recipe: linear/MLP over time,
                             # Mamba over variates (memory-scalable)
  mamba_layers: 2
  mamba_d_state: 32          # richer state for many variates
  mamba_d_conv: 4
  mamba_expand: 2
  use_official_mamba: true
  freq_hidden: 512
  freq_dropout: 0.1
  freq_sparsity: 0.0
  freq_encoder: linear
  channel_mixer_layers: 2  # the core of the model on high-channel data
  mixer_placement: shared  # weight-tie one mixer across branches: halves the
                           # mixer parameters (d512+shared ~10.6M vs d512+both
                           # ~19.7M). The mixer-placement ablation is reported in
                           # the manuscript (results/Ablation_electricity_mixer.json).
  fusion: gated
  head_dropout: 0.1

train:
  device: auto
  epochs: 10
  batch_size: 16
  lr: 0.0005
  weight_decay: 0.0001
  loss: mse
  grad_clip: 5.0
  num_workers: 4
  patience: 5
  amp: true
  lr_scheduler: halve      # lr *= 0.5 each epoch; converges before patience can misfire
  compile: false

# Traffic — road occupancy of 862 SF Bay Area sensors, hourly (862 channels,
# 17,544 rows). The largest channel count: channel-independent processing
# folds C into the batch (8 x 862 = 6,896 sequences per step) -- batch sized
# for a 32 GB RTX 5090; halve batch_size if you hit OOM.
# Standard split: 0.7 / 0.1 / 0.2. Horizons: pred_len in {96, 192, 336, 720}.
# Strong daily/weekly periodicity -> higher lr converges well here.

experiment:
  name: traffic
  seed: 2024
  checkpoint_dir: checkpoints

data:
  source: csv
  csv_path: data/traffic.csv
  target_columns: null
  seq_len: 96
  pred_len: 96
  train_ratio: 0.7
  val_ratio: 0.1
  scale: true

model:
  d_model: 512               # top-model capacity for many variates
  time_kernel_size: 25
  time_dropout: 0.1
  time_encoder: mlp          # S-Mamba recipe: linear/MLP over time,
                             # Mamba over variates (memory-scalable)
  mamba_layers: 2
  mamba_d_state: 32          # richer state for many variates
  mamba_d_conv: 4
  mamba_expand: 2
  use_official_mamba: true
  freq_hidden: 512
  freq_dropout: 0.1
  freq_sparsity: 0.0
  freq_encoder: linear
  channel_mixer_layers: 4  # deeper variate mixing: the mixer is the dominant
                           # component on high-channel data (ablation-verified
                           # on solar), and traffic's 862 sensors are where
                           # S-Mamba-class depth pays. Halve batch_size on OOM.
  fusion: gated
  head_dropout: 0.1

train:
  device: auto
  epochs: 10
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  loss: mse
  grad_clip: 5.0
  num_workers: 4
  patience: 5
  amp: true
  lr_scheduler: halve      # lr *= 0.5 each epoch; converges before patience can misfire
  compile: false
